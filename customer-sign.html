<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>A-1 Invoice Signature</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f3f5;color:#111;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.brand{background:#111418;color:#fff;border-top:6px solid #d7192d;padding:22px;border-radius:12px 12px 0 0}.brand b{font-size:24px}.card{background:#fff;padding:22px;border-radius:0 0 12px 12px;box-shadow:0 10px 35px #0001}.muted{color:#666;font-size:13px;line-height:1.45}.scope{background:#f7f7f7;border-left:4px solid #d7192d;padding:14px;margin:18px 0;line-height:1.5}.row{display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #eee;padding:10px 0}.row span:first-child{max-width:70%}.total{font-size:21px;font-weight:800;text-align:right;margin:20px 0}.sigbox{border:2px solid #222;border-radius:10px;background:#fff;overflow:hidden;touch-action:none}.sigbox canvas{width:100%;height:180px;display:block;touch-action:none}.name{width:100%;padding:13px;border:1px solid #bbb;border-radius:9px;font-size:16px;margin:10px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.actions button{border:0;border-radius:9px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#d7192d;color:#fff}.secondary{background:#e9eaec;color:#111}.status{padding:12px;border-radius:9px;background:#f5f6f7;margin:12px 0}.signed-img{max-width:320px;max-height:130px;border-bottom:1px solid #bbb}.fine{font-size:11px;color:#666;line-height:1.45;margin-top:10px}@media(max-width:600px){.wrap{padding:0}.brand,.card{border-radius:0}.card{padding:16px}.sigbox canvas{height:210px}}</style></head><body><div class="wrap"><div class="brand"><b>A-1 Plumbing & Heating Co.</b><div style="margin-top:5px;color:#bbb">Secure customer invoice approval</div></div><div class="card" id="app"><div class="status">Loading invoice…</div></div></div><script>
const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('token')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=v=>Number(v||0).toLocaleString(undefined,{style:'currency',currency:'USD'});
let session=null,canvas=null,ctx=null,drawing=false,hasInk=false;
function render(){const s=session, snap=s.snapshot||{},d=snap.doc||{},c=snap.customer||{},items=snap.items||[];app.innerHTML=`<div class="muted">INVOICE #${esc(d.invoice_number||'—')} • REVISION ${Number(s.revision||1)}</div><h1 style="margin:.35rem 0">${esc(d.title||'Service Invoice')}</h1><div class="muted">Prepared for ${esc(c.name||'Customer')}</div>${d.description?`<div class="scope">${esc(d.description)}</div>`:''}<div>${items.map(x=>`<div class="row"><span>${esc(x.description||'Line item')}<div class="muted">${Number(x.quantity||1)} × ${money(x.unit_price)}</div></span><b>${money(x.line_total??Number(x.quantity||1)*Number(x.unit_price||0))}</b></div>`).join('')}</div><div class="total">Total: ${money(d.total)}</div>${s.signed_at?`<div class="status"><b>✓ Signed</b><div class="muted">Signed by ${esc(s.customer_name||'Customer')} on ${new Date(s.signed_at).toLocaleString()}.</div>${s.signature_data?`<img class="signed-img" src="${s.signature_data}" alt="Customer signature">`:''}</div><div class="fine">This is the preserved signed revision. If A-1 later changes the invoice, the new revision requires a new customer signature.</div>`:`<h3>Customer signature</h3><input id="name" class="name" placeholder="Type your full name" autocomplete="name"><div class="sigbox"><canvas id="sig" width="900" height="350" aria-label="Signature box"></canvas></div><div class="actions"><button id="clear" class="secondary" type="button">Clear / Redo</button><button id="sign" class="primary" type="button">Sign & Accept</button></div><div class="fine">By signing electronically, the customer acknowledges that the work described on this invoice has been completed and accepts the completed work, except for any items specifically noted on this invoice. The signed revision is preserved for both parties.</div><div id="msg" class="status" style="display:none"></div>`}`;if(!s.signed_at)setupCanvas();}
function setupCanvas(){canvas=document.getElementById('sig');ctx=canvas.getContext('2d');ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';const point=e=>{const r=canvas.getBoundingClientRect(),t=e.touches?.[0]||e;return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)}};const start=e=>{e.preventDefault();drawing=true;hasInk=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};const move=e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};const stop=e=>{if(drawing)e.preventDefault();drawing=false};['pointerdown'].forEach(n=>canvas.addEventListener(n,start));['pointermove'].forEach(n=>canvas.addEventListener(n,move));['pointerup','pointercancel','pointerleave'].forEach(n=>canvas.addEventListener(n,stop));canvas.addEventListener('touchstart',start,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',stop,{passive:false});document.getElementById('clear').onclick=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);hasInk=false};document.getElementById('sign').onclick=sign;}
async function sign(){const msg=document.getElementById('msg'),btn=document.getElementById('sign'),name=document.getElementById('name').value.trim();if(name.length<2){msg.style.display='block';msg.textContent='Please enter your full name.';return}if(!hasInk){msg.style.display='block';msg.textContent='Please sign inside the signature box.';return}btn.disabled=true;btn.textContent='Signing…';msg.style.display='block';msg.textContent='Saving your signed invoice…';try{const data=canvas.toDataURL('image/jpeg',.9),r=await fetch('/api/sign-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,customer_name:name,signature_data:data})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not sign invoice');await load();}catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Sign & Accept';}}
async function load(){try{const r=await fetch('/api/signing-session?token='+encodeURIComponent(token)),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not load invoice');session=j;render()}catch(e){app.innerHTML=`<div class="status"><b>Unable to open invoice</b><div class="muted">${esc(e.message)}</div></div>`}}load();
</script></body></html>
