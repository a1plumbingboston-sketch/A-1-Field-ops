<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>A-1 Customer Document</title><link rel="stylesheet" href="document-system.css"><style>@font-face{font-family:A1Signature;src:url(signature-font.ttf) format("truetype");font-weight:400 700;font-display:block}body{margin:0;background:#eee;font-family:Arial,sans-serif}.wrap{max-width:850px;padding:16px;margin:auto}.status{padding:16px;background:white}.current-payment{margin-bottom:16px;background:#f7f3e9;border:1px solid #d8d0c2;border-radius:14px;color:#18394b}.current-payment h2{font-size:18px;margin:0 0 8px}.current-payment-amount{font-size:30px}.current-payment small{display:block;line-height:1.5;color:#586873}button{font:inherit}button:disabled{opacity:.6}@media(max-width:600px){.wrap{padding:0}}</style></head><body><main class="wrap" id="app"><p class="status">Loading document…</p></main><script src="document-system.js"></script><script>
const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('token')||'',esc=A1Documents.esc;
let session,canvas,ctx,drawing=false,hasInk=false,saving=false,activePointer=null;
function render(){const s=session;document.title='A-1 '+A1Documents.labels[s.kind];const existing=document.getElementById('saved-style');if(existing)existing.remove();const style=document.createElement('style');style.id='saved-style';style.textContent=s.snapshot.css||'';document.head.append(style);app.innerHTML=s.snapshot.html;const locationBlock=app.querySelector('.cd-parties > div:nth-child(2)');const locationLines=locationBlock?Array.from(locationBlock.children).filter(el=>el.tagName==='DIV'):[];if(locationLines.length>1&&locationLines[0].textContent===String(s.snapshot.doc?.title||'Service work'))locationLines[0].remove();const notice=document.createElement('section');notice.className='status';notice.innerHTML=s.signed_at?'<b>Signed document saved</b><p>Download your permanent signed PDF below.</p>':'<b>Review your read-only document, then sign below</b><p>Prices, scope and terms cannot be edited here. Contact A-1 if corrections are needed. No Google Docs or PDF editor is required.</p><a href="#signature-slot" id="go-sign">Go to signature box</a>';app.prepend(notice);showCurrentPayment(s.current_payment);const slot=document.getElementById('signature-slot');if(!slot)throw new Error('Document signature area is missing');
 if(s.signed_at){slot.innerHTML=`<img class="cd-signature" alt="Customer signature" src="${esc(s.signature_data)}"><p><b>Signed by ${esc(s.customer_name)}</b> · ${esc(new Date(s.signed_at).toLocaleString())}</p>${s.exceptions?`<p>Completion exceptions: ${esc(s.exceptions)}</p>`:''}<p>This signed document is preserved. Later changes require a separate change order.</p><a class="cd-download" href="/api/signing-session?token=${encodeURIComponent(token)}&download=pdf">Download signed PDF</a>`;return;}
 slot.innerHTML=`<div class="cd-sign-controls"><p>${s.kind==='invoice'?'Enter your full name. Review your signature below, then tap <b>Sign &amp; Accept</b> to adopt it as your electronic signature.':'Enter your full name, draw your signature in the outlined box, then tap <b>Sign &amp; Accept</b>.'} Your signature will appear in this area on the saved PDF.</p><label for="name">Full name (required)</label><input id="name" autocomplete="name" required minlength="2" maxlength="120">${s.kind==='completion'?'<label for="exceptions">Completion exceptions / Unresolved items (optional)</label><textarea id="exceptions" maxlength="1000" rows="2"></textarea>':''}<label for="sig">${s.kind==='invoice'?'Your signature':'Draw your signature'}</label><canvas id="sig" width="900" height="350" aria-label="${s.kind==='invoice'?'Your signature':'Draw your signature'}" style="touch-action:none;aspect-ratio:18/7;height:auto;min-height:140px;border:2px solid #c9202f"></canvas>${s.kind==='invoice'?'':'<button id="clear" type="button">Clear / Redo</button>'}<button id="sign" type="button" class="primary">Sign & Accept</button><div role="status" id="msg"></div></div>`;if(s.kind==='invoice')setupTypedSignature();else setupCanvas();if(location.hash==='#signature-slot')slot.scrollIntoView({block:'start'});}
function showCurrentPayment(p){
 if(!p)return;const box=document.createElement('section');box.className='status current-payment';box.setAttribute('aria-label','Current payment status');
 const titles={settled:'No balance due',credit:'Credit balance on account',pending:'Payment pending',due:'Current balance due',review:'Payment status needs review',unavailable:'Current payment status unavailable'};
 const title=document.createElement('h2');title.textContent=titles[p.status]||titles.unavailable;box.append(title);
 const text=document.createElement('p');
 if(['settled','credit','due','pending'].includes(p.status)){const amount=document.createElement('strong');amount.className='current-payment-amount';amount.textContent=A1Documents.money(Math.abs(p.balance));box.append(amount);text.textContent='Payments recorded: '+A1Documents.money(p.paid)+' · Approved credits: '+A1Documents.money(p.credits)+'. '+(p.status==='pending'?'A payment is processing. Check its status before attempting another payment.':'');}
 else text.textContent='Contact A-1 at 339-224-4517 to confirm your balance before making another payment.';
 box.append(text);const note=document.createElement('small');note.textContent='This live account status is separate from the preserved document below. Amounts inside the document reflect when it was prepared.'+(p.checked_at?' Checked '+new Date(p.checked_at).toLocaleString()+'.':'');box.append(note);app.prepend(box);
}
async function setupTypedSignature(){
 canvas=document.getElementById('sig');ctx=canvas.getContext('2d');hasInk=false;
 const input=document.getElementById('name');let sequence=0;
 async function update(){const current=++sequence;hasInk=false;ctx.fillStyle='white';ctx.fillRect(0,0,900,350);const name=input.value.trim();if(name.length<2)return;
 try{await document.fonts.load('64px A1Signature');if(!document.fonts.check('64px A1Signature'))throw new Error('font');}catch{document.getElementById('msg').textContent='Signature font could not load. Please refresh and try again.';return;}
 if(current!==sequence||saving)return;ctx.fillStyle='#111';ctx.textAlign='center';ctx.textBaseline='middle';let size=90;ctx.font=size+'px A1Signature';while(ctx.measureText(name).width>820&&size>16){size-=2;ctx.font=size+'px A1Signature';}ctx.fillText(name,450,175,820);hasInk=true;document.getElementById('msg').textContent='';}
 input.oninput=update;document.getElementById('sign').onclick=sign;await update();
}
function setupCanvas(){
 canvas=document.getElementById('sig');ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,900,350);ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#111';hasInk=false;drawing=false;activePointer=null;
 const point=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];};
 canvas.onpointerdown=e=>{if(saving||activePointer!==null)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);activePointer=e.pointerId;drawing=true;ctx.beginPath();ctx.moveTo(...point(e));};
 canvas.onpointermove=e=>{if(saving||!drawing||e.pointerId!==activePointer)return;e.preventDefault();ctx.lineTo(...point(e));ctx.stroke();hasInk=true;};
 canvas.onpointerup=canvas.onpointercancel=canvas.onlostpointercapture=e=>{if(e.pointerId===activePointer){drawing=false;activePointer=null;}};
 document.getElementById('clear').onclick=()=>{if(saving)return;ctx.fillRect(0,0,900,350);hasInk=false;document.getElementById('msg').textContent='Signature cleared. Draw again in the box.';};document.getElementById('sign').onclick=sign;
}
async function sign(){if(saving)return;const btn=document.getElementById('sign'),msg=document.getElementById('msg'),name=document.getElementById('name').value.trim();if(name.length<2||!hasInk){msg.textContent=typeof session!=='undefined'&&session?.kind==='invoice'?'Enter your full name and wait for your signature to appear.':'Enter your full name and draw your signature.';return;}saving=true;document.querySelectorAll('.cd-sign-controls input,.cd-sign-controls textarea,.cd-sign-controls button').forEach(e=>e.disabled=true);msg.textContent='Saving signed document…';try{const r=await fetch('/api/sign-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,customer_name:name,signature_data:canvas.toDataURL('image/jpeg',.9),exceptions:document.getElementById('exceptions')?.value||''})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Could not sign');await load();if(j.customer_copy_sent===false){const note=document.createElement('p');note.textContent='Your signature is saved. Email delivery did not complete; use Download signed PDF to keep your copy.';app.append(note);}}catch(e){msg.textContent=e.message;document.querySelectorAll('.cd-sign-controls input,.cd-sign-controls textarea,.cd-sign-controls button').forEach(e=>e.disabled=false);}finally{saving=false;}}
async function load(){try{const r=await fetch('/api/signing-session?token='+encodeURIComponent(token)),j=await r.json();if(!r.ok)throw new Error(j.error||'Could not open document');session=j;render();}catch(e){app.innerHTML=`<p class="status">${esc(e.message)}</p>`;}}
load();
</script></body></html>
