<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>A-1 Customer Document</title><link rel="stylesheet" href="document-system.css"><style>body{margin:0;background:#eee;font-family:Arial,sans-serif}.wrap{max-width:850px;padding:16px;margin:auto}.status{padding:16px;background:white}button{font:inherit}button:disabled{opacity:.6}@media(max-width:600px){.wrap{padding:0}}</style></head><body><main class="wrap" id="app"><p class="status">Loading document…</p></main><script src="document-system.js"></script><script>
const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('token')||'',esc=A1Documents.esc;
let session,canvas,ctx,drawing=false,hasInk=false;
function render(){const s=session;document.title='A-1 '+A1Documents.labels[s.kind];const existing=document.getElementById('saved-style');if(existing)existing.remove();const style=document.createElement('style');style.id='saved-style';style.textContent=s.snapshot.css||'';document.head.append(style);app.innerHTML=s.snapshot.html;const slot=document.getElementById('signature-slot');if(!slot)throw new Error('Document signature area is missing');
 if(s.signed_at){slot.innerHTML=`<img class="cd-signature" alt="Customer signature" src="${esc(s.signature_data)}"><p><b>Signed by ${esc(s.customer_name)}</b> · ${esc(new Date(s.signed_at).toLocaleString())}</p>${s.exceptions?`<p>Completion exceptions: ${esc(s.exceptions)}</p>`:''}<p>This signed document is preserved. Later changes require a separate change order.</p><a class="cd-download" href="/api/signing-session?token=${encodeURIComponent(token)}&download=pdf">Download signed PDF</a>`;return;}
 slot.innerHTML=`<div class="cd-sign-controls"><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="120">${['completion','invoice'].includes(s.kind)?'<label for="exceptions">Completion exceptions / Unresolved items (optional)</label><textarea id="exceptions" maxlength="1000" rows="2"></textarea>':''}<label for="sig">Draw your signature</label><canvas id="sig" width="900" height="350" aria-label="Draw your signature"></canvas><button id="clear" type="button">Clear / Redo</button><button id="sign" type="button" class="primary">Sign & Accept</button><div role="status" id="msg"></div></div>`;setupCanvas();}
function setupCanvas(){canvas=document.getElementById('sig');ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,900,350);ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#111';hasInk=false;canvas.onpointerdown=e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;const r=canvas.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*900/r.width,(e.clientY-r.top)*350/r.height);};canvas.onpointermove=e=>{if(!drawing)return;e.preventDefault();const r=canvas.getBoundingClientRect();ctx.lineTo((e.clientX-r.left)*900/r.width,(e.clientY-r.top)*350/r.height);ctx.stroke();hasInk=true;};canvas.onpointerup=canvas.onpointercancel=()=>{drawing=false;};document.getElementById('clear').onclick=()=>{ctx.fillRect(0,0,900,350);hasInk=false;};document.getElementById('sign').onclick=sign;}
async function sign(){const btn=document.getElementById('sign'),msg=document.getElementById('msg'),name=document.getElementById('name').value.trim();if(name.length<2||!hasInk){msg.textContent='Enter your full name and draw your signature.';return;}btn.disabled=true;msg.textContent='Saving signed document…';try{const r=await fetch('/api/sign-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,customer_name:name,signature_data:canvas.toDataURL('image/jpeg',.9),exceptions:document.getElementById('exceptions')?.value||''})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Could not sign');await load();if(j.customer_copy_sent===false){const note=document.createElement('p');note.textContent='Your signature is saved. Email delivery did not complete; use Download signed PDF to keep your copy.';app.append(note);}}catch(e){msg.textContent=e.message;btn.disabled=false;}}
async function load(){try{const r=await fetch('/api/signing-session?token='+encodeURIComponent(token)),j=await r.json();if(!r.ok)throw new Error(j.error||'Could not open document');session=j;render();}catch(e){app.innerHTML=`<p class="status">${esc(e.message)}</p>`;}}
load();
</script></body></html>
