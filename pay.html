<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pay A-1 invoice</title><style>body{margin:0;background:#f4f4f4;color:#191919;font:17px system-ui}main{max-width:480px;margin:32px auto;padding:24px;background:white;border-radius:16px}img{width:130px}button{width:100%;padding:15px;border:0;border-radius:8px;background:#bc1025;color:white;font:inherit;font-weight:700}button:disabled{opacity:.5}#apple{display:none;-webkit-appearance:-apple-pay-button;-apple-pay-button-type:pay;-apple-pay-button-style:black;height:48px;margin-bottom:18px}#message{line-height:1.5}small{display:block;margin:16px 0;color:#555}@media(max-width:540px){main{margin:0;border-radius:0;min-height:100vh;box-sizing:border-box}}</style><main><img src="a1-logo.png" alt="A-1 Plumbing & Heating"><h1>Pay your invoice</h1><p id="title"></p><h2 id="amount"></h2><button id="apple" aria-label="Pay with Apple Pay"></button><div id="card"></div><button id="pay" disabled>Loading secure payment form…</button><p id="message" role="status"></p><small>Your card details are handled securely by Square. A-1 FieldOps does not store your card number.</small><p>Questions? <a href="tel:3392244517">339-224-4517</a></p></main><script>
const token=new URLSearchParams(location.search).get('token'),button=document.querySelector('#pay'),message=document.querySelector('#message');let card,info,payments,applePay,submitting=false;const appleButton=document.querySelector('#apple');
async function call(body){const r=await fetch('/api/documents?payment=square'+(body?'':'&token='+encodeURIComponent(token||'')),{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify({token,...body}):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Payment unavailable');return j;}
async function init(){try{info=await call();document.querySelector('#title').textContent=info.title;document.querySelector('#amount').textContent=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(info.amount);if(info.status==='paid'){button.textContent='Payment received';return;}if(info.status==='failed'||(info.expired&&info.status!=='processing'))throw new Error('This link is closed. Contact A-1 for a new payment link.');if(info.status==='processing'){button.textContent='Check pending payment';button.disabled=false;message.textContent='A payment is already being processed. Check it here before attempting another payment.';return;}await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=info.sandbox?'https://sandbox.web.squarecdn.com/v1/square.js':'https://web.squarecdn.com/v1/square.js';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load Square. Refresh to try again.'));document.head.append(s);});payments=Square.payments(info.application_id,info.location_id);card=await payments.card();await card.attach('#card');button.textContent='Pay '+document.querySelector('#amount').textContent;button.disabled=false;try{applePay=await payments.applePay(payments.paymentRequest({countryCode:'US',currencyCode:'USD',total:{amount:info.amount.toFixed(2),label:'A-1 Invoice'}}));appleButton.style.display='block';}catch{}}catch(e){message.textContent=e.message;button.textContent='Payment unavailable';}}

function cardError(result){
 if(result?.status==='Cancel')return 'Payment canceled. No payment was submitted.';
 const errors=Array.isArray(result?.errors)?result.errors:[];
 const fields=errors.map(e=>String(e.field||'').toLowerCase()).join(' ');
 if(/postal/.test(fields))return 'Check the billing ZIP or postal code for this card. No payment was submitted.';
 if(/cvv/.test(fields))return 'Check the card security code. No payment was submitted.';
 if(/expiration/.test(fields))return 'Check the card expiration date. No payment was submitted.';
 if(/cardnumber|card_number/.test(fields))return 'Check the card number. No payment was submitted.';
 return 'Square could not verify the card. Check the card number, expiration, security code and billing ZIP. If these are correct, open this payment link in Safari or Chrome. No payment was submitted.';
}
function paymentError(error){
 if(info?.status==='processing')return 'We could not confirm the payment result. Use Check pending payment on this same link before paying again. Contact A-1 if it remains pending.';
 const text=typeof error==='string'?error:error?.message;
 if(typeof text==='string'&&text.trim()&&!/^try again[.!]?$/i.test(text.trim()))return text;
 return 'Square could not verify the card. Open this payment link in Safari or Chrome and check your card details. No payment was submitted.';
}

async function submitPayment(method){if(submitting||info?.status==='paid')return;submitting=true;button.disabled=true;appleButton.disabled=true;message.textContent='Confirming payment…';try{let source_id='',verification_token;if(info.status!=='processing'){const details={amount:info.amount.toFixed(2),currencyCode:'USD',intent:'CHARGE',billingContact:{},customerInitiated:true,sellerKeyedIn:false};const result=method===applePay?await method.tokenize():await method.tokenize(details);if(result.status!=='OK')throw new Error(cardError(result));source_id=result.token;if(method===applePay){const verification=await payments.verifyBuyer(source_id,{amount:details.amount,currencyCode:'USD',intent:'CHARGE',billingContact:result.details?.billing||{}});verification_token=verification?.token;}}info.status='processing';const result=await call({source_id,verification_token});if(result.status==='COMPLETED'){info.status='paid';button.textContent='Payment received';appleButton.style.display='none';message.textContent='Thank you. Your payment has been recorded.';}else{button.textContent='Check pending payment';button.disabled=false;appleButton.style.display='none';message.textContent='Payment is pending. Do not submit another payment.';}}catch(e){message.textContent=paymentError(e);button.textContent=info.status==='processing'?'Check pending payment':'Review card details';button.disabled=false;if(info.status==='processing')appleButton.style.display='none';else appleButton.disabled=false;}finally{submitting=false;}}
button.onclick=()=>submitPayment(card);appleButton.onclick=()=>submitPayment(applePay);init();
</script></html>
